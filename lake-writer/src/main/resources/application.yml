server:
  port: 8082

spring:
  application:
    name: lake-writer

lake:
  s3:
    endpoint: ${LAKE_S3_ENDPOINT:http://localhost:9000}
    access-key: ${LAKE_S3_ACCESS_KEY:seaweedfsadmin}
    secret-key: ${LAKE_S3_SECRET_KEY:seaweedfsadmin}
    region: ${LAKE_S3_REGION:us-east-1}
    bucket: ${LAKE_S3_BUCKET:inventory-lake}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
